name: "Publish Fluss Gateway Image"

permissions:
  contents: read

on:
  push:
    tags:
      - 'gateway-v*'
  workflow_dispatch:

jobs:
  publish-gateway-image:
    name: "Build and Push Gateway Image"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Derive image tags"
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "workflow_dispatch is only supported on git tags" >&2
            exit 1
          fi

          raw_tag="${GITHUB_REF_NAME}"
          version="${raw_tag#gateway-}"
          image="docker.io/beryllwang/fluss-gateway"

          if [[ "${version}" == "${raw_tag}" ]]; then
            echo "unexpected tag format: ${raw_tag} (expected gateway-v*)" >&2
            exit 1
          fi

          stable=true
          if [[ "${version}" =~ -(alpha|beta|rc)[0-9.-]*$ ]]; then
            stable=false
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"

          {
            echo 'tags<<EOF'
            echo "${image}:${version}"
            if [[ "${stable}" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: "Build and push image"
        uses: docker/build-push-action@v6
        with:
          context: fluss-gateway
          file: docker/fluss-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=fluss-gateway
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
