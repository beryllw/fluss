name: Build Gateway Test Image Artifacts

on:
  push:
    branches:
      - codex/publish-gateway-image-4098
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: fluss-gateway
  IMAGE_TAG: 1b940e41226c
  SOURCE_SHA: 1b940e41226c6ba2bd1fd5dd1de4fd7609e8ace6

jobs:
  build-and-upload:
    name: Build and upload Gateway (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build, smoke test, and export architecture image
        shell: bash
        env:
          GATEWAY_ARCH: ${{ matrix.arch }}
          GATEWAY_BUILD_CACHE_FROM: type=gha,scope=fluss-gateway-${{ matrix.arch }}
          GATEWAY_BUILD_CACHE_TO: type=gha,mode=max,scope=fluss-gateway-${{ matrix.arch }}
          RUN_SMOKE: "true"
          VCS_REF: ${{ env.SOURCE_SHA }}
        run: |
          export FLUSS_VERSION="dev-${IMAGE_TAG}"
          export GATEWAY_IMAGE="${IMAGE}:${IMAGE_TAG}-${GATEWAY_ARCH}"
          docker/fluss-gateway/build.sh
          docker save \
            --output "/tmp/fluss-gateway-${IMAGE_TAG}-${GATEWAY_ARCH}.tar" \
            "${GATEWAY_IMAGE}"

      - name: Upload architecture image
        uses: actions/upload-artifact@v4
        with:
          name: fluss-gateway-${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          path: /tmp/fluss-gateway-${{ env.IMAGE_TAG }}-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 7
