# Gateway CI also follows the native Rust client sources used by its configuration adapter.
# `uses:` step inputs are relative to the repository root.
name: Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - 'fluss-gateway/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/crates/fluss/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fluss-gateway/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/crates/fluss/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fluss-gateway

jobs:
  build-and-unit-test:
    name: "Gateway Build and Tests"
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-gateway

      # Without `--locked` Cargo rewrites a stale lockfile in the CI workspace, and the run would
      # validate a dependency graph the repository does not contain.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Unit Test
        run: cargo test --locked --all-targets
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

      - name: OpenAPI drift check
        run: |
          cargo test --locked --lib protocol::rest::openapi::tests::export_checked_in_document -- --ignored --exact
          git diff --exit-code openapi.yaml

      - name: OpenAPI external validation
        run: npx --yes @redocly/cli@1 lint openapi.yaml

  integration-test:
    name: "Gateway + Fluss Integration Test"
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Share the same cache key as client-integration.yml. Gateway-only changes restore the
      # same-revision server image instead of rebuilding the Java distribution.
      - name: Cache server image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/fluss-dev.tar
          key: fluss-dev-image-${{ hashFiles('fluss-server/**', 'fluss-common/**', 'fluss-rpc/**', 'fluss-dist/**', 'docker/fluss/**', 'pom.xml') }}

      - name: Set up JDK 17
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build server image (fluss:dev)
        if: steps.image-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          ./mvnw -B --no-transfer-progress clean package -pl fluss-dist -am -DskipTests
          rm -rf docker/fluss/build-target
          mkdir -p docker/fluss/build-target
          cp -r build-target/* docker/fluss/build-target/
          docker build -t fluss:dev docker/fluss
          docker save fluss:dev -o /tmp/fluss-dev.tar

      - name: Load server image
        run: docker load -i /tmp/fluss-dev.tar

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            fluss-gateway
            fluss-rust

      - name: Build Fluss test cluster helper
        run: cargo build --locked --manifest-path ../fluss-rust/Cargo.toml -p fluss-test-cluster

      - name: Integration Test
        run: cargo test --locked --features integration_tests --test e2e_cluster
        env:
          FLUSS_TEST_CLUSTER_BIN: ${{ github.workspace }}/fluss-rust/target/debug/fluss-test-cluster
          FLUSS_IMAGE: fluss
          FLUSS_VERSION: dev
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

  msrv:
    name: "Gateway MSRV (1.88)"
    # rust-toolchain.toml floats to stable, so a plain build never catches features newer
    # than the declared rust-version; `+toolchain` overrides the file here.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-gateway

      - name: Check on the declared MSRV
        run: cargo +1.88.0 check --locked --all-targets

  check-license-and-formatting:
    name: "Gateway License and Formatting Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check License Header
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        with:
          config: fluss-gateway/.licenserc.yaml

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.14.22

      - name: Check dependency licenses (Apache-compatible)
        run: cargo deny --locked check licenses

      - name: Check banned dependencies (HTTP/2 stack stays out)
        run: cargo deny --locked check bans

      # The inventory ships with the source release, so a stale one is worse than none.
      - name: Dependency inventory drift check
        run: |
          cargo deny --locked list -f tsv -t 0.6 | sed 's/[[:space:]]*$//' > DEPENDENCIES.rust.tsv
          git diff --exit-code DEPENDENCIES.rust.tsv

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-gateway

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustdoc
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
