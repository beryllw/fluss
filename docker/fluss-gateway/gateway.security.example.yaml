# Example gateway.yaml enforcing password authentication (FIP-49).
# Mount it into the container and point the binary at it:
#
#   docker run -v $(pwd)/gateway.security.example.yaml:/etc/fluss-gateway/gateway.yaml:ro \
#       apache/fluss-gateway --config /etc/fluss-gateway/gateway.yaml
#
# The file is YAML with flat dotted keys; FLUSS_GATEWAY__* environment
# variables still override any key in it.

gateway.clusters: default
gateway.cluster.default.bootstrap.servers: coordinator-server:9123

gateway.rest.listen: 0.0.0.0:8080
gateway.metrics.exporter.prometheus.listen: 0.0.0.0:9095

# Password mode: every request needs HTTP Basic credentials from this table.
# Secrets are either plaintext or `bcrypt:<hash>` (htpasswd -B compatible;
# bob's hash below is for `secret456`).
gateway.security.authentication: password
gateway.security.users: "alice:secret123,bob:bcrypt:$2y$05$ZuVetpn1qbVVplOClQQW3eOlQAmzsQ4btwjFl8kcOxELaLPdqJOOW"
