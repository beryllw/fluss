components:
  schemas:
    AlterTableBody:
      additionalProperties: false
      description: Body of `PATCH /v1/clusters/{cluster}/databases/{database}/tables/{table}`.
      properties:
        changes:
          description: The server currently rejects mixing schema and config changes.
          items:
            $ref: '#/components/schemas/TableChangeBody'
          type: array
      required:
      - changes
      type: object
    ClustersResponse:
      description: 'Response of `GET /v1/clusters`: the IDs used in the cluster-scoped paths of the other APIs.'
      properties:
        clusters:
          items:
            type: string
          type: array
      required:
      - clusters
      type: object
    ColumnBody:
      additionalProperties: false
      description: One column; top-level nullability belongs here, not inside `data_type`.
      properties:
        comment:
          type:
          - string
          - 'null'
        data_type:
          $ref: '#/components/schemas/ColumnDataType'
        name:
          type: string
        nullable:
          description: Primary-key columns default to false and reject true; other columns default to true.
          type:
          - boolean
          - 'null'
      required:
      - name
      - data_type
      type: object
    ColumnDataType:
      description: A Fluss column type; top-level nullability is declared by the column.
      oneOf:
      - additionalProperties: false
        properties:
          type:
            enum:
            - BOOLEAN
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - TINYINT
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - SMALLINT
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - INTEGER
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - BIGINT
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - FLOAT
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - DOUBLE
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          length:
            format: int32
            minimum: 0
            type: integer
          type:
            enum:
            - CHAR
            type: string
        required:
        - length
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - STRING
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          precision:
            format: int32
            maximum: 38
            minimum: 1
            type: integer
          scale:
            format: int32
            maximum: 38
            minimum: 0
            type: integer
          type:
            enum:
            - DECIMAL
            type: string
        required:
        - precision
        - scale
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - DATE
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          precision:
            format: int32
            maximum: 9
            minimum: 0
            type: integer
          type:
            enum:
            - TIME_WITHOUT_TIME_ZONE
            type: string
        required:
        - precision
        - type
        type: object
      - additionalProperties: false
        properties:
          precision:
            format: int32
            maximum: 9
            minimum: 0
            type: integer
          type:
            enum:
            - TIMESTAMP_WITHOUT_TIME_ZONE
            type: string
        required:
        - precision
        - type
        type: object
      - additionalProperties: false
        properties:
          precision:
            format: int32
            maximum: 9
            minimum: 0
            type: integer
          type:
            enum:
            - TIMESTAMP_WITH_LOCAL_TIME_ZONE
            type: string
        required:
        - precision
        - type
        type: object
      - additionalProperties: false
        properties:
          type:
            enum:
            - BYTES
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          length:
            minimum: 0
            type: integer
          type:
            enum:
            - BINARY
            type: string
        required:
        - length
        - type
        type: object
      - additionalProperties: false
        properties:
          element_type:
            $ref: '#/components/schemas/WireDataType'
          type:
            enum:
            - ARRAY
            type: string
        required:
        - element_type
        - type
        type: object
      - additionalProperties: false
        properties:
          key_type:
            $ref: '#/components/schemas/WireDataType'
          type:
            enum:
            - MAP
            type: string
          value_type:
            $ref: '#/components/schemas/WireDataType'
        required:
        - key_type
        - value_type
        - type
        type: object
      - additionalProperties: false
        properties:
          fields:
            items:
              $ref: '#/components/schemas/WireRowField'
            type: array
          type:
            enum:
            - ROW
            type: string
        required:
        - fields
        - type
        type: object
    ColumnResponse:
      description: One column of a table schema.
      properties:
        comment:
          type: string
        data_type:
          $ref: '#/components/schemas/ColumnDataType'
        name:
          type: string
        nullable:
          type: boolean
      required:
      - name
      - data_type
      - nullable
      type: object
    CreateDatabaseBody:
      additionalProperties: false
      description: Body of `POST /v1/clusters/{cluster}/databases`.
      properties:
        database:
          type: string
      required:
      - database
      type: object
    CreatePartitionBody:
      additionalProperties: false
      description: Body of `POST .../tables/{table}/partitions`.
      properties:
        partition:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
      required:
      - partition
      type: object
    CreateTableBody:
      additionalProperties: false
      description: Body of `POST /v1/clusters/{cluster}/databases/{database}/tables`.
      properties:
        columns:
          items:
            $ref: '#/components/schemas/ColumnBody'
          type: array
        comment:
          type:
          - string
          - 'null'
        configs:
          additionalProperties:
            type: string
          description: Fluss table properties, validated by the server.
          propertyNames:
            type: string
          type: object
        custom_properties:
          additionalProperties:
            type: string
          description: Custom table metadata; keys must not use the reserved `table.` prefix.
          propertyNames:
            type: string
          type: object
        distribution:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DistributionBody'
        partitioned_by:
          items:
            type: string
          type: array
        primary_key:
          description: Primary-key columns; omit for a log table.
          items:
            type: string
          type:
          - array
          - 'null'
        table_name:
          type: string
        validate_only:
          description: Build and validate the definition locally without creating anything.
          type: boolean
      required:
      - table_name
      - columns
      type: object
    DatabaseResponse:
      description: Response of a database creation.
      properties:
        database:
          type: string
      required:
      - database
      type: object
    DatabasesResponse:
      description: Response of `GET /v1/clusters/{cluster}/databases`.
      properties:
        databases:
          items:
            type: string
          type: array
        next_page_token:
          description: Present only while more entries follow.
          type: string
      required:
      - databases
      type: object
    DistributionBody:
      additionalProperties: false
      description: The bucket distribution of a table definition.
      properties:
        bucket_count:
          format: int32
          minimum: 1
          type: integer
        bucket_keys:
          items:
            type: string
          type: array
      required:
      - bucket_count
      - bucket_keys
      type: object
    DistributionResponse:
      description: The bucket distribution of a table.
      properties:
        bucket_count:
          format: int32
          minimum: 1
          type: integer
        bucket_keys:
          items:
            type: string
          type: array
      required:
      - bucket_count
      - bucket_keys
      type: object
    ErrorBody:
      description: Body of the REST error envelope.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          description: Correlates the response with the `x-request-id` header and the access log.
          format: uuid
          type: string
      required:
      - code
      - message
      - request_id
      type: object
    ErrorCode:
      description: Stable error code, resource-specific where the error names a resource.
      enum:
      - already_exists
      - backend
      - cancelled
      - cluster_already_exists
      - cluster_not_found
      - database_already_exists
      - database_not_empty
      - database_not_found
      - failed_precondition
      - internal
      - invalid_argument
      - limit_exceeded
      - method_not_allowed
      - not_acceptable
      - not_found
      - partition_already_exists
      - partition_not_found
      - resource_exhausted
      - table_already_exists
      - table_not_found
      - timeout
      - unauthenticated
      - unauthorized
      - unavailable
      - unsupported
      - unsupported_media_type
      type: string
    ErrorEnvelope:
      description: 'REST error envelope: `{"error": {"code", "message", "request_id"}}`.'
      examples:
      - error:
          code: table_not_found
          message: table `mydb.orders` does not exist
          request_id: 8f6c7f4a-f9b8-4c71-91ec-6e5578d7a913
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
      type: object
    HealthResponse:
      description: 'Response of `GET /health`: liveness plus process uptime.'
      properties:
        status:
          type: string
        uptime_ms:
          description: Milliseconds since the gateway process started.
          format: int64
          minimum: 0
          type: integer
      required:
      - status
      - uptime_ms
      type: object
    PartitionEntry:
      description: One partition in a listing.
      properties:
        name:
          description: Native partition name; percent-encode it as a path segment when deleting.
          type: string
        partition:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
      required:
      - name
      - partition
      type: object
    PartitionResponse:
      description: Response of a partition creation.
      properties:
        database:
          type: string
        partition:
          additionalProperties:
            type: string
          propertyNames:
            type: string
          type: object
        table:
          type: string
      required:
      - database
      - table
      - partition
      type: object
    PartitionsResponse:
      description: Response of `GET /v1/clusters/{cluster}/databases/{database}/tables/{table}/partitions`.
      properties:
        next_page_token:
          description: Present only while more entries follow.
          type: string
        partitions:
          items:
            $ref: '#/components/schemas/PartitionEntry'
          type: array
      required:
      - partitions
      type: object
    ReadyResponse:
      description: 'Response of `GET /ready`: the gateway accepts application traffic.'
      properties:
        status:
          type: string
      required:
      - status
      type: object
    TableChangeBody:
      description: |-
        One supported table change. Config keys under `table.` address Fluss table properties;
        other keys address custom properties.
      oneOf:
      - description: 'An added column must be nullable: existing rows have no value for it.'
        properties:
          comment:
            type:
            - string
            - 'null'
          data_type:
            $ref: '#/components/schemas/ColumnDataType'
          kind:
            enum:
            - add_column
            type: string
          name:
            type: string
        required:
        - name
        - data_type
        - kind
        type: object
      - properties:
          key:
            type: string
          kind:
            enum:
            - set_config
            type: string
          value:
            type: string
        required:
        - key
        - value
        - kind
        type: object
      - description: Removes the explicitly configured value.
        properties:
          key:
            type: string
          kind:
            enum:
            - reset_config
            type: string
        required:
        - key
        - kind
        type: object
    TableResponse:
      description: Response of `GET /v1/clusters/{cluster}/databases/{database}/tables/{table}`.
      properties:
        columns:
          items:
            $ref: '#/components/schemas/ColumnResponse'
          type: array
        comment:
          type: string
        configs:
          additionalProperties:
            type: string
          description: Fluss table properties.
          propertyNames:
            type: string
          type: object
        custom_properties:
          additionalProperties:
            type: string
          description: Custom table metadata.
          propertyNames:
            type: string
          type: object
        database:
          type: string
        distribution:
          $ref: '#/components/schemas/DistributionResponse'
        partitioned_by:
          items:
            type: string
          type: array
        primary_key:
          items:
            type: string
          type: array
        table:
          type: string
      required:
      - database
      - table
      - columns
      type: object
    TablesResponse:
      description: Response of `GET /v1/clusters/{cluster}/databases/{database}/tables`.
      properties:
        next_page_token:
          description: Present only while more entries follow.
          type: string
        tables:
          items:
            type: string
          type: array
      required:
      - tables
      type: object
    ValidateOnlyResponse:
      description: The result of a successful local `validate_only` dry run.
      properties:
        column_count:
          minimum: 0
          type: integer
        database:
          type: string
        primary_key:
          items:
            type: string
          type: array
        table:
          type: string
        validate_only:
          type: boolean
      required:
      - validate_only
      - database
      - table
      - column_count
      - primary_key
      type: object
    WireDataType:
      description: The exact recursive Fluss type as it appears on the wire.
      oneOf:
      - additionalProperties: false
        properties:
          nullable:
            type: boolean
          type:
            enum:
            - BOOLEAN
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          nullable:
            type: boolean
          type:
            enum:
            - TINYINT
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          nullable:
            type: boolean
          type:
            enum:
            - SMALLINT
            type: string
        required:
        - type
        type: object
      - additionalProperties: false
        properties:
          nullable:
            type: boolean
          type:
