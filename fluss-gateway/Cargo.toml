# The gateway is its own Cargo workspace. It depends on the Rust client by
# path but deliberately stays out of the workspace rooted at ../fluss-rust so
# that gateway dependencies never touch that workspace's lock file or its
# generated dependency inventories.
[workspace]
resolver = "2"

[package]
name = "fluss-gateway"
edition = "2024"
version = "1.0.0"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["Apache Fluss <dev@fluss.apache.org>"]
repository = "https://github.com/apache/fluss"
publish = false
description = "Stateless REST gateway for Apache Fluss"

[[bin]]
name = "fluss-gateway"
path = "src/main.rs"

[lib]
name = "fluss_gateway"

[features]
# Compiles the end-to-end suites in tests/, which start a dockerized Fluss
# cluster. Mirrors the `integration_tests` feature of the fluss-rs crate and
# is never enabled by default.
integration_tests = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio"] }
clap = { version = "4.5.37", features = ["derive"] }
toml = "0.8"
futures = "0.3"
# Process CPU/RSS/fd sampling for the FIP-49 process_* metric families.
libc = "0.2"
log = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The shared query-string parser of the REST layer (`parse_query`).
serde_urlencoded = "0.7"
# The gateway.yaml configuration file is YAML with flat dotted keys (FIP-49).
serde_yaml = "0.9"
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
fluss-test-cluster = { path = "../fluss-rust/crates/fluss-test-cluster" }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
tempfile = "3"
tokio = { version = "1.44.2", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "http_api"

[[test]]
name = "process"

[[test]]
name = "e2e_harness"
