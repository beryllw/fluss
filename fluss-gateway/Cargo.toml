# Fluss Gateway — dependency version matrix (see DESIGN.md §3).
#
# Aligned to the upstream `fluss-rust` datafusion-v0.3.2 line:
#   datafusion = 53.0.0, arrow = 58.0.0, tokio = 1.44.2
# The PostgreSQL compatibility stack is pinned around that line:
#   pgwire 0.40.x         -> matches arrow-pg 0.14 (pgwire ^0.40)
#   arrow-pg 0.14         -> targets arrow ^58 / datafusion ^53 (feature "datafusion")
#   datafusion-pg-catalog 0.17 -> targets datafusion ^53
#
# Fluss access uses the upstream `fluss-datafusion` + `fluss-rs` crates as pinned
# git dependencies at rev 0422cb2 (tag datafusion-v0.3.2). This line provides
# `FlussDatafusion::swap_connection` (runtime connection hot-swap) and a
# self-healing RPC layer (a stopped connection is reconnected; scanner metadata
# retries are bounded), which the gateway's connection-recovery manager builds on.
# fluss-datafusion's `lake` feature (Paimon) is left OFF, so the git dependency is
# self-contained. Gateway code talks to Fluss only through narrow gateway-defined
# contract traits (e.g. `FlussCatalogInstaller`, `FlussConnectionProvider`,
# `BackendFacade`): the real crates back those traits in production while fakes back
# them in tests, so the gateway never absorbs catalog/execution/type logic.
# `datafusion` + `arrow` are also direct public deps because the SQL path needs
# SessionContext / RecordBatch.

[package]
name = "fluss-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SQL/REST gateway for Apache Fluss (PostgreSQL read-only + REST direct write)"
publish = false

# Runnable server binary (see src/main.rs). The crate is also a library that the
# integration tests build against.
[[bin]]
name = "fluss-gateway"
path = "src/main.rs"

[dependencies]
# --- Core async runtime ---
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# --- SQL engine (public crates; df53/arrow58 line) ---
datafusion = "53.0.0"
arrow = { version = "58.0.0", features = ["ipc_compression", "ffi", "json"] }
arrow-schema = "58.0.0"

# --- PostgreSQL wire / compatibility stack ---
# NOTE: pgwire must stay semver-compatible with the pgwire arrow-pg pulls in, so
# cargo unifies both to ONE pgwire instance — otherwise arrow-pg's encoded row
# types cannot be fed into our pgwire server handlers. Do not bump pgwire alone.
pgwire = "0.40"
arrow-pg = { version = "0.14", features = ["datafusion"] }
datafusion-pg-catalog = "0.17"

# --- Connection hot-swap (recovery manager) ---
arc-swap = "1"

# --- Fluss access (git deps; datafusion-v0.3.1 line aligns df53/arrow58) ---
# `lake` (Paimon) left off -> self-contained git dependency.
fluss = { package = "fluss-rs", git = "https://github.com/beryllw/fluss-rust.git", rev = "0422cb20c29d151730ac97600bb4bd9c5398b13f", features = ["storage-all"] }
fluss-datafusion = { git = "https://github.com/beryllw/fluss-rust.git", rev = "0422cb20c29d151730ac97600bb4bd9c5398b13f" }

# --- HTTP (REST direct path + OTLP HTTP) ---
axum = "0.8"
# OTLP protobuf request/response messages (HTTP adapter only; no SDK/exporter).
prost = "0.14"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }

# --- Serialization / error / misc ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gateway config file (auth user table) is YAML.
serde_yaml = "0.9"
thiserror = "2"
bytes = "1"
# Auth: optional sha256:<hex> password hashing + constant-time comparison. All
# already in the dependency tree transitively (zero extra build cost).
sha2 = "0.10"
hex = "0.4"
subtle = "2"
# PostgreSQL client introspection (psql \dt/\d) SQL rewrite, see server/postgres/compat.rs.
regex = "1"
tracing = "0.1"
# Server-binary logging (RUST_LOG filter). Also used by tests as a dev-dependency.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Unguessable per-connection PG cancel backend-key secret.
rand = "0.8"

# --- MCP (Model Context Protocol) read-only adapter (server/mcp/) ---
# Official Rust SDK over Streamable HTTP. It does NOT depend on arrow/datafusion/
# pgwire, so it is orthogonal to the frozen df53/arrow58 line; it unifies onto the
# axum 0.8 / hyper 1 / tower 0.5 / tokio already in the tree (no version bump —
# `cargo add` pulled only leaf crates: rmcp, rmcp-macros, sse-stream, pastey,
# schemars_derive, serde_derive_internals). `default-features = false` keeps the
# client/reqwest transports out; `macros` gives #[tool]/#[tool_router]. schemars
# is re-exported as `rmcp::schemars`, so no direct schemars dependency is needed.
rmcp = { version = "1.7", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "macros",
] }
# rmcp's #[derive(JsonSchema)] expands to `schemars::` paths, so schemars must be
# a named dependency. It is already in the tree (serde_with pulls 1.2.x), so this
# unifies onto that exact version with no bump — verified by the Cargo.lock diff.
schemars = "1"

[features]
# Real-cluster end-to-end tests (tests/cluster_e2e.rs). Off by default so plain
# `cargo test` stays cluster-free; enable with `--features integration_tests`,
# which needs a container runtime (docker) and the apache/fluss image. Verifies
# the live cluster path (REST write -> readback, PG SELECT, recovery).
integration_tests = []

[dev-dependencies]
# Brings up a throwaway Fluss cluster in docker for the integration_tests path.
# Same git rev as the `fluss` / `fluss-datafusion` deps so the client types unify.
fluss-test-cluster = { git = "https://github.com/beryllw/fluss-rust.git", rev = "0422cb20c29d151730ac97600bb4bd9c5398b13f" }
# Real PostgreSQL wire client for protocol integration tests (P4). Drives the
# gateway over loopback TCP with no Fluss cluster, against a fake GatewayInstance.
tokio-postgres = "0.7"
# Real HTTP client for REST direct-path integration tests (P5). Drives the axum
# frontend over loopback TCP with no Fluss cluster, against a fake GatewayInstance.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Real MCP client for the MCP integration test: drives the Streamable HTTP server
# the same way an agent would (initialize handshake, tools/list, tools/call). Same
# rmcp version as the normal dependency; cargo unifies the feature set for the test
# build, so this only turns on the client transports — no new crate version.
rmcp = { version = "1.7", default-features = false, features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
