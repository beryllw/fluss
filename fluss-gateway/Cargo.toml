# Fluss Gateway — Phase 1 dependency version matrix (P0, see DESIGN.md §3).
#
# This crate must align with the upstream `fluss-rust-community` workspace line:
#   datafusion = 52.0.0, arrow = 57.0.0, tokio = 1.44.2
# The PostgreSQL compatibility stack is pinned around that line:
#   pgwire 0.38.x         -> matches arrow-pg 0.12.2 (pgwire ^0.38)
#   arrow-pg 0.12.2       -> targets arrow ^57 / datafusion ^52 (feature "datafusion")
#   datafusion-pg-catalog 0.15.0 -> targets datafusion ^52
# The newer datafusion-postgres family (df53/arrow58/pgwire0.40) is intentionally
# NOT used: it would pull arrow 58 / datafusion 53 and break alignment with the
# upstream df52/arrow57 line. Dependency upgrades are a separate, later work item.
#
# Fluss access uses the upstream `fluss-datafusion` + `fluss-rs` crates as pinned
# git dependencies pinned to rev 74754da (tag datafusion-v0.2.3 at
# verification time). They share this exact
# df52/arrow57/tokio-1.44 line, so cargo unifies cleanly. Gateway code still talks
# to Fluss only through narrow gateway-defined contract traits (e.g.
# `FlussCatalogInstaller`, `FlussConnectionProvider`, `BackendFacade`): the real
# crates back those traits in production while fakes back them in tests, so the
# gateway never absorbs catalog/execution/type logic. `datafusion` + `arrow` are
# also direct public deps because the SQL path needs SessionContext / RecordBatch.

[package]
name = "fluss-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SQL/REST gateway for Apache Fluss (PostgreSQL read-only + REST direct write)"
publish = false

# Runnable server binary (see src/main.rs). The crate is also a library that the
# integration tests build against.
[[bin]]
name = "fluss-gateway"
path = "src/main.rs"

[dependencies]
# --- Core async runtime ---
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# --- SQL engine (public crates; df52/arrow57 line) ---
datafusion = "52.0.0"
arrow = { version = "57.0.0", features = ["ipc_compression", "ffi", "json"] }
arrow-schema = "57.0.0"

# --- PostgreSQL wire / compatibility stack ---
# NOTE: pgwire must stay semver-compatible with the pgwire arrow-pg pulls in, so
# cargo unifies both to ONE pgwire instance — otherwise arrow-pg's encoded row
# types cannot be fed into our pgwire server handlers. Do not bump pgwire alone.
pgwire = "0.38"
arrow-pg = { version = "0.12.2", features = ["datafusion"] }
datafusion-pg-catalog = "0.15.0"

# --- Fluss access (git deps; datafusion-v0.2.3 line aligns df52/arrow57) ---
fluss = { package = "fluss-rs", git = "https://github.com/beryllw/fluss-rust.git", rev = "74754da3286fe96f18243a234fa828ebe2274934", features = ["storage-all"] }
fluss-datafusion = { git = "https://github.com/beryllw/fluss-rust.git", rev = "74754da3286fe96f18243a234fa828ebe2274934" }

# --- HTTP (REST direct path) ---
axum = "0.8"

# --- Serialization / error / misc ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytes = "1"
# PostgreSQL client introspection (psql \dt/\d) SQL rewrite, see server/postgres/compat.rs.
regex = "1"
tracing = "0.1"
# Server-binary logging (RUST_LOG filter). Also used by tests as a dev-dependency.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Unguessable per-connection PG cancel backend-key secret (§P4.6).
rand = "0.8"

[features]
# Real-cluster end-to-end tests (tests/cluster_e2e.rs). Off by default so plain
# `cargo test` stays cluster-free; enable with `--features integration_tests`,
# which needs a container runtime (docker) and the apache/fluss image. Verifies
# TASKS §4 T1-T4 against a live cluster (REST write -> readback, PG SELECT).
integration_tests = []

[dev-dependencies]
# Brings up a throwaway Fluss cluster in docker for the integration_tests path.
# Same git rev as the `fluss` / `fluss-datafusion` deps so the client types unify.
fluss-test-cluster = { git = "https://github.com/beryllw/fluss-rust.git", rev = "74754da3286fe96f18243a234fa828ebe2274934" }
# Real PostgreSQL wire client for protocol integration tests (P4). Drives the
# gateway over loopback TCP with no Fluss cluster, against a fake GatewayInstance.
tokio-postgres = "0.7"
# Real HTTP client for REST direct-path integration tests (P5). Drives the axum
# frontend over loopback TCP with no Fluss cluster, against a fake GatewayInstance.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
